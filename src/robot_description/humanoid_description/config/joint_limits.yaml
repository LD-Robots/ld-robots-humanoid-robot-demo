# Joint limits configuration for humanoid robot
# Format: {joint_name: {min_position, max_position, max_velocity, max_effort}}

# All angles in radians, velocities in rad/s, efforts in Nm

# ==================== HEAD ====================
neck_yaw:
  min_position: -1.57  # -90 degrees
  max_position: 1.57   # 90 degrees
  max_velocity: 2.0
  max_effort: 10.0

neck_pitch:
  min_position: -0.79  # -45 degrees
  max_position: 0.79   # 45 degrees
  max_velocity: 2.0
  max_effort: 10.0

# ==================== TORSO ====================
torso_yaw:
  min_position: -0.52  # -30 degrees
  max_position: 0.52   # 30 degrees
  max_velocity: 1.5
  max_effort: 50.0

torso_pitch:
  min_position: -0.52
  max_position: 0.52
  max_velocity: 1.5
  max_effort: 50.0

torso_roll:
  min_position: -0.35  # -20 degrees
  max_position: 0.35   # 20 degrees
  max_velocity: 1.5
  max_effort: 50.0

# ==================== ARMS (LEFT/RIGHT) ====================
# Pattern: {left|right}_{joint_name}

shoulder_pitch:
  min_position: -3.14  # -180 degrees
  max_position: 3.14   # 180 degrees
  max_velocity: 2.5
  max_effort: 100.0  # RS04 motor

shoulder_roll:
  min_position: -3.14
  max_position: 3.14
  max_velocity: 2.5
  max_effort: 100.0  # RS04 motor

shoulder_yaw:
  min_position: -3.14
  max_position: 3.14
  max_velocity: 2.5
  max_effort: 100.0  # RS04 motor

elbow_pitch:
  min_position: 0.0
  max_position: 2.62   # 150 degrees
  max_velocity: 3.0
  max_effort: 50.0   # RS03 motor

elbow_yaw:
  min_position: -1.57
  max_position: 1.57
  max_velocity: 3.0
  max_effort: 50.0   # RS03 motor

wrist_pitch:
  min_position: -1.57
  max_position: 1.57
  max_velocity: 3.5
  max_effort: 20.0   # RS02 motor

wrist_roll:
  min_position: -1.57
  max_position: 1.57
  max_velocity: 3.5
  max_effort: 20.0   # RS02 motor

# ==================== HANDS (LEFT/RIGHT) ====================
# Pattern: {left|right}_finger_{name}_{joint}

finger_joint:  # Generic finger joint limits
  min_position: 0.0
  max_position: 1.57   # 90 degrees
  max_velocity: 4.0
  max_effort: 5.0    # RS02 motor

thumb_joint:
  min_position: 0.0
  max_position: 1.57
  max_velocity: 4.0
  max_effort: 5.0

# ==================== LEGS (LEFT/RIGHT) ====================
# Pattern: {left|right}_{joint_name}

hip_yaw:
  min_position: -0.79  # -45 degrees
  max_position: 0.79   # 45 degrees
  max_velocity: 2.0
  max_effort: 150.0  # RS04 motor

hip_roll:
  min_position: -0.79
  max_position: 0.79
  max_velocity: 2.0
  max_effort: 150.0  # RS04 motor

hip_pitch:
  min_position: -2.09  # -120 degrees
  max_position: 2.09   # 120 degrees
  max_velocity: 2.0
  max_effort: 150.0  # RS04 motor

knee_pitch:
  min_position: 0.0
  max_position: 2.62   # 150 degrees
  max_velocity: 2.5
  max_effort: 150.0  # RS04 motor

ankle_pitch:
  min_position: -0.79
  max_position: 0.79
  max_velocity: 2.5
  max_effort: 50.0   # RS03 motor

ankle_roll:
  min_position: -0.52
  max_position: 0.52
  max_velocity: 2.5
  max_effort: 50.0   # RS03 motor
