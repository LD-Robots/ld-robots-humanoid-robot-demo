# Balance Control System Parameters
# This file contains all tunable parameters for the balance control system

# IMU Feedback Processor Parameters
imu_feedback_processor:
  ros__parameters:
    # Complementary filter coefficient (0.0-1.0)
    # Higher values trust gyroscope more, lower values trust accelerometer more
    complementary_filter_alpha: 0.98

    # Gyroscope bias detection threshold (rad/s)
    # Angular velocity below this is considered zero (for bias estimation)
    gyro_bias_threshold: 0.01

    # Maximum allowable tilt angle before warning (radians)
    # Default: 0.5 rad ≈ 28.6 degrees
    max_tilt_angle: 0.5

    # Update rate (Hz) - should match IMU sensor rate
    update_rate: 100.0

# Center of Mass (CoM) Controller Parameters
com_controller:
  ros__parameters:
    # Robot base link name
    base_link: "base"

    # PD controller gains for CoM position control
    # Higher Kp = stronger position correction
    # Higher Kd = more damping (velocity feedback)
    com_kp: 1.0
    com_kd: 0.1

    # Weight distribution between ankle and hip compensation
    # ankle_weight + hip_weight should approximately equal 1.0
    # Higher ankle weight = more ankle torque, less hip movement
    ankle_weight: 0.7
    hip_weight: 0.3

    # Safety limits
    max_ankle_torque: 10.0  # Nm
    max_hip_torque: 15.0    # Nm

    # CoM estimation parameters
    com_height_nominal: 0.5  # meters - approximate standing CoM height

# Zero Moment Point (ZMP) Stabilizer Parameters
zmp_stabilizer:
  ros__parameters:
    # Foot dimensions (meters)
    # These define the support polygon size
    foot_length: 0.20  # 20 cm fore-aft
    foot_width: 0.10   # 10 cm medial-lateral

    # Foot separation (distance between feet in double support)
    foot_separation: 0.20  # 20 cm hip width

    # PD controller gains for ZMP stabilization
    # Higher gains = more aggressive ZMP correction
    zmp_kp: 2.0
    zmp_kd: 0.5

    # Safety margin from support polygon edge (meters)
    # ZMP should stay this far inside the polygon boundary
    safety_margin: 0.02  # 2 cm

    # Maximum ZMP correction torque (Nm)
    max_zmp_torque: 20.0

    # Torque blending weights (CoM vs ZMP)
    # ZMP gets higher weight for immediate stability
    com_torque_weight: 0.4
    zmp_torque_weight: 0.6

    # Gravity constant (m/s^2)
    gravity: 9.81

# Leg Balance Controller Parameters
leg_balance_controller:
  ros__parameters:
    # KDL chain definitions
    left_leg_chain_base: "base"
    left_leg_chain_tip: "LFootBushing_GPF_1517_12"
    right_leg_chain_base: "base"
    right_leg_chain_tip: "RFootBushing_GPF_1517_12"

    # Control loop rate (Hz)
    control_rate: 100.0

    # Conversion gains from torque to position
    # Lower values = less aggressive, more stable
    ankle_torque_to_position_gain: 0.005  # rad/Nm (reduced from 0.01)
    hip_torque_to_position_gain: 0.005    # rad/Nm (reduced from 0.01)

    # Dead-zone thresholds (ignore small compensations)
    ankle_torque_deadzone: 0.5   # Nm - ignore torques below this
    hip_torque_deadzone: 0.5     # Nm - ignore torques below this
    body_tilt_deadzone: 0.05     # rad (~3 degrees) - don't react to small tilts

    # Only apply leg control when needed
    enable_only_when_unstable: true  # Only act when ZMP is unstable or tilt is large

    # Auto-calibration parameters
    enable_auto_calibration: false  # Disabled by default - enable after tuning
    calibration_rate: 0.01  # Learning rate (reduced from 0.1 for slower learning)

    # Safety limits
    max_joint_velocity: 0.5  # rad/s - reduced for smoother motion
    max_position_change: 0.05  # rad - maximum position change per cycle

    # IK solver parameters
    ik_solver_epsilon: 0.0001  # Convergence threshold for IK

# Balance System Integration Parameters
balance_system:
  ros__parameters:
    # Overall system enable/disable
    enable_balance_control: true

    # Enable individual controllers
    enable_imu_feedback: true
    enable_com_control: true
    enable_zmp_stabilization: true
    enable_leg_control: true

    # Emergency stop parameters
    # System will trigger emergency stop if these limits are exceeded
    emergency_tilt_limit: 0.8      # radians (~45 degrees)
    emergency_com_velocity: 2.0    # m/s
    emergency_zmp_distance: 0.15   # meters from polygon center

    # Logging and debugging
    publish_debug_topics: true
    log_level: "info"  # debug, info, warn, error

# Get-Up Behavior Parameters
get_up_behavior:
  ros__parameters:
    # Tilt thresholds for detecting fallen state
    # Robot is considered fallen if tilt exceeds this threshold
    fallen_tilt_threshold: 1.0  # rad (~57 degrees) - robot is fallen

    # Robot is considered standing if tilt is below this threshold
    standing_tilt_threshold: 0.3  # rad (~17 degrees) - robot is upright

    # Control loop rate (Hz)
    control_rate: 50.0  # Lower rate for get-up behavior (smoother motion)

    # Duration for each trajectory point in get-up sequence
    get_up_duration_per_point: 1.0  # seconds - time to reach each pose

    # Enable/disable get-up behavior
    # Set to false to disable automatic recovery from falls
    enable_get_up: true

    # Path to get-up sequences configuration file
    # This file contains all the joint positions for get-up behaviors
    # NOTE: This parameter is set in the launch file using PathJoinSubstitution
    # sequences_config_file: ""  # Set by launch file
