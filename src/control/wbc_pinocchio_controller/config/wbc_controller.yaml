wbc_controller:
  ros__parameters:
    use_sim_time: true

    # Paths
    model_xml_path: /home/alex/Documents/GitHub/ld-robots-humanoid-robot-demo/src/robot_description/humanoid_description/urdf/robot.xml
    urdf_path: /home/alex/Documents/GitHub/ld-robots-humanoid-robot-demo/src/robot_description/humanoid_description/urdf/robot.xml

    # Topics
    target_positions_topic: /target_positions
    joint_states_topic: /joint_states
    imu_topic: /imu/data
    base_pose_topic: /pelvis/pose
    com_in_world: false         # Use model frame (world frame has sign issues)
    hold_enabled: true
    hold_enter_duration: 0.8
    hold_com_threshold: 0.015
    hold_vel_threshold: 0.20
    hold_release_com_threshold: 0.02
    hold_release_vel_threshold: 0.08

    # Phase gating (walk only)
    phase_hold_enabled: true
    phase_error_threshold: 0.06
    phase_hold_max: 0.001
    phase_hold_progress_gate: 0.9

    # Control timing
    control_rate: 100.0
    walking_enabled: true
    balance_active: true
    stabilize_duration: 2.0          # Quick stabilization

    # Dynamic quasi-static gait - moderate speed
    step_duration: 0.3              # 1s per step - balance between speed and stability
    step_length: 0.025               # 2.5cm steps - need forward progress!
    step_height: 0.015               # Moderate lift
    stance_width: 0.1

    # Support/swing posture
    support_knee_bend: 0.2
    swing_knee_bend: 0.4
    support_hip_pitch: 0.35       # STRONG FORWARD LEAN for dynamic walking!
    swing_hip_pitch: 0.47          # Forward lean during swing
    support_ankle_pitch: 0.22     # Strong forward lean at ankle
    swing_ankle_pitch: 0.40        # Neutral swing ankle
    hip_roll_shift: 0.0            # Reduce from 0.1 - too aggressive
    swing_hip_roll_out: 0.0        # Small outward hip roll
    support_hip_yaw: 0.00         # Small outward yaw
    swing_hip_yaw: 0.0

    # Balance correction - AGGRESSIVE for dynamic walking
    balance_kp_pitch: 2.650750160217285    # Higher gain for dynamic response
    balance_kd_pitch: 0.9191917777061462    # Strong damping for stability
    balance_kp_roll: 3.691147804260254     # Higher roll gain
    balance_kd_roll: 0.4751751124858856     # Higher roll damping
    balance_pitch_sign: -1.0 # FLIPPED: Inverted correction direction
    imu_kp_pitch: 0.9975625276565552       # Strong IMU feedback for fast tilt correction
    imu_kd_pitch: 0.1258784979581833       # Increased IMU damping
    imu_kp_roll: 1.0279145240783691         # Strong roll IMU feedback
    imu_kd_roll: 0.07954587042331696        # Increased IMU roll damping
    ankle_pitch_limit: 0.22  # More range for aggressive corrections
    hip_pitch_limit: 0.45    # More hip pitch range
    ankle_roll_limit: 0.02   # More roll range
    hip_roll_limit: 0.02     # More hip roll range
    com_deadzone: 0.005      # Very responsive - no delay!
    foot_length: 0.12
    foot_width: 0.08
    prediction_time: 0.04    # Moderate prediction horizon

    # Filtering
    filter_alpha: 0.25       # Less filtering for faster response during walking
    log_period: 1.0

    # Crocoddyl
    use_crocoddyl: false

    # Initial pose source
    initial_pose_yaml: /home/alex/Documents/GitHub/ld-robots-humanoid-robot-demo/src/control/wbc_pinocchio_controller/config/initial_pose.yaml
    initial_pose_key: 'stable_stance'

    # Foot frames for support center
    left_foot_frame: left_ankle_roll_link
    right_foot_frame: right_ankle_roll_link
    support_center_x_offset: -0.0005 # NEGATIVE = Target CoM AHEAD of support (forward bias!)
