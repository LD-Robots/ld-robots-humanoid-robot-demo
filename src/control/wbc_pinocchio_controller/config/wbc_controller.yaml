wbc_controller:
  ros__parameters:
    use_sim_time: true

    # Paths
    model_xml_path: /home/alex/Documents/GitHub/ld-robots-humanoid-robot-demo/src/robot_description/humanoid_description/urdf/robot.xml
    urdf_path: /home/alex/Documents/GitHub/ld-robots-humanoid-robot-demo/src/robot_description/humanoid_description/urdf/robot.xml

    # Topics
    target_positions_topic: /target_positions
    joint_states_topic: /joint_states
    imu_topic: /imu/data
    base_pose_topic: /pelvis/pose
    com_in_world: false         # Use model frame (world frame has sign issues)
    hold_enabled: true
    hold_enter_duration: 0.8
    hold_com_threshold: 0.015
    hold_vel_threshold: 0.20
    hold_release_com_threshold: 0.02
    hold_release_vel_threshold: 0.08

    # Phase gating (walk only)
    phase_hold_enabled: true
    phase_error_threshold: 0.06
    phase_hold_max: 0.001
    phase_hold_progress_gate: 0.9

    # Control timing
    control_rate: 100.0
    walking_enabled: false
    balance_active: true
    stabilize_duration: 3.0

    # Quasi-static gait
    step_duration: 0.3
    step_length: 0.01
    step_height: 0.02
    stance_width: 0.1

    # Support/swing posture
    support_knee_bend: 0.28
    swing_knee_bend: 0.65
    support_hip_pitch: 0.20
    swing_hip_pitch: 0.25
    support_ankle_pitch: 0.08
    swing_ankle_pitch: 0.12
    hip_roll_shift: 0.08
    swing_hip_roll_out: 0.05
    support_hip_yaw: 0.02
    swing_hip_yaw: 0.0

    # Balance correction - tuned for fast response without overshoot
    balance_kp_pitch: 1.8    # Moderate gain for responsive correction
    balance_kd_pitch: 0.6    # Moderate damping to prevent oscillations
    balance_kp_roll: 2.5     # Moderate roll gain
    balance_kd_roll: 0.3     # Moderate roll damping
    balance_pitch_sign: -1.0 # FLIPPED: Inverted correction direction
    imu_kp_pitch: 0.5        # Moderate IMU feedback for fast tilt correction
    imu_kd_pitch: 0.08       # Increased IMU damping
    imu_kp_roll: 0.5         # Moderate roll IMU feedback
    imu_kd_roll: 0.08        # Increased IMU roll damping
    ankle_pitch_limit: 0.10  # Increased from 0.08 for more range
    hip_pitch_limit: 0.3
    ankle_roll_limit: 0.03   # Increased from 0.02
    hip_roll_limit: 0.10
    com_deadzone: 0.008      # Reduced for earlier response (was ignoring errors!)
    foot_length: 0.12
    foot_width: 0.08
    prediction_time: 0.04    # Moderate prediction horizon

    # Filtering
    filter_alpha: 0.15       # Reduced from 0.2 for more aggressive filtering (smoother)
    log_period: 1.0

    # Crocoddyl
    use_crocoddyl: false

    # Initial pose source
    initial_pose_yaml: /home/alex/Documents/GitHub/ld-robots-humanoid-robot-demo/src/control/wbc_pinocchio_controller/config/initial_pose.yaml
    initial_pose_key: 'stable_stance'

    # Foot frames for support center
    left_foot_frame: left_ankle_roll_link
    right_foot_frame: right_ankle_roll_link
    support_center_x_offset: -0.01
